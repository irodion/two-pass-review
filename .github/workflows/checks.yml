# The mechanical floor, and nothing above it.
#
# None of this checks whether a review is any good. That is settled by running
# the skill and reading the report, which needs a model and an artifact and so
# stays out of CI on purpose -- see AGENTS.md. What runs here is the set of
# constraints a contributor can break silently, where the failure surfaces on
# someone else's machine long after the change.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  interpreters:
    # The floor is 3.10 -- see AGENTS.md for why it moved off the macOS system
    # interpreter's 3.9. The modern leg is not redundant:
    # it catches deprecations written to stderr, which the orchestrator reads as
    # though the script failed.
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # scope.py resolves real revision ranges below: HEAD~1..HEAD, and
          # HEAD~2..HEAD~1, whose head is not the checkout.
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: compile every script
        run: python -m compileall -q .agents/skills/two-pass-review/scripts
      - name: import cleanly, with warnings fatal
        working-directory: .agents/skills/two-pass-review/scripts
        env:
          PYTHONWARNINGS: error::DeprecationWarning,error::SyntaxWarning
        # Every script in the directory, found rather than listed: a script
        # left off a hand-kept list would import with its warnings never made
        # fatal, and nothing would say so. The assertion is the guard on the
        # glob itself -- a wrong directory finds nothing, and importing
        # nothing passes.
        run: |
          python -c "import glob, importlib; names = sorted(p[:-3] for p in glob.glob('*.py')); assert 'scope' in names, names; [importlib.import_module(n) for n in names]"
      - name: install ruff, which try_rule.py starts
        run: pip install ruff==0.12.9
      - name: run the entry points, with warnings fatal
        # Importing a module does not execute its main(), so a deprecation inside
        # one stays invisible to the step above -- datetime.utcnow() in scope.py
        # would be the classic. These actually run.
        # Warnings are fatal through PYTHONWARNINGS, set once for the step, and
        # not through -W at each call. They were -W at each call, 23 of them, and
        # python reads a mistyped -W category as a line in the log and runs on
        # with warnings at their default, so one typo turned one call's gate off
        # and failed nothing. No shell expands an env entry, so it holds whatever
        # shell runs the step; and it reaches every python the script starts,
        # the one-line checks included, which costs nothing. Per step, not per job, because
        # pip runs in this job between the two steps that set it, and a
        # deprecation in pip is not one of ours to fail on.
        env:
          PYTHONWARNINGS: error::DeprecationWarning,error::SyntaxWarning
        run: .github/entry-points.sh

  lint:
    # Style and types are floor checks like the rest: ruff's rule set, the
    # formatter, and mypy --strict, all pinned so a tool release cannot change
    # what passes. What they enforce and why lives in pyproject.toml.
    # .githooks/pre-push mirrors this job locally.
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.12.9 mypy==2.3.1
      - run: ruff check --no-fix
      - run: ruff format --check
      - run: mypy

  constraints:
    name: constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python .github/checks.py

  install:
    name: readme install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: .github/replay-readme-install.sh
