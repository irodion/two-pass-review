# The mechanical floor, and nothing above it.
#
# None of this checks whether a review is any good. That is settled by running
# the skill and reading the report, which needs a model and an artifact and so
# stays out of CI on purpose -- see AGENTS.md. What runs here is the set of
# constraints a contributor can break silently, where the failure surfaces on
# someone else's machine long after the change.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  interpreters:
    # The floor is 3.10 -- see AGENTS.md for why it moved off the macOS system
    # interpreter's 3.9. The modern leg is not redundant:
    # it catches deprecations written to stderr, which the orchestrator reads as
    # though the script failed.
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # scope.py resolves a real revision range below, so HEAD~1 has to exist.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: compile every script
        run: python -m compileall -q .agents/skills/two-pass-review/scripts
      - name: import cleanly, with warnings fatal
        working-directory: .agents/skills/two-pass-review/scripts
        run: |
          python -W error::DeprecationWarning \
                 -W error::SyntaxWarning \
                 -c "import markdown_subset, page, validate, render, scope, collect_docs, diff_paths"
      - name: run the entry points, with warnings fatal
        # Importing a module does not execute its main(), so a deprecation inside
        # one stays invisible to the step above -- datetime.utcnow() in scope.py
        # would be the classic. These actually run.
        # The flags are written out at each call rather than held in a variable:
        # unquoted expansion only word-splits because the shell happens to be
        # bash, and a check whose teeth depend on that is a check that silently
        # loses them.
        run: |
          set -eux
          S=.agents/skills/two-pass-review/scripts
          # The whole of scope: git plumbing, the timestamped run dir, JSON out.
          python -W error::DeprecationWarning -W error::SyntaxWarning \
                 "$S/scope.py" --repo . --base HEAD~1 --mode revisions --head HEAD > scope.json
          python -c "import json,sys; d=json.load(open('scope.json')); sys.exit(0 if d['scope']['files_changed'] else 1)"
          # Doc collection over the same real range. The assertion is on
          # README.md because this repository certainly has one: an empty list
          # here means the collector stopped finding anything, not that there
          # was nothing to find.
          python -W error::DeprecationWarning -W error::SyntaxWarning \
                 "$S/collect_docs.py" --repo . \
                 --diff "$(python -c "import json;print(json.load(open('scope.json'))['context_diff'])")" > docs.json
          python -c "import json,sys; d=json.load(open('docs.json')); sys.exit(0 if any(x['path']=='README.md' for x in d['docs']) else 1)"
          # Both refuse-and-explain paths, which is where argparse and the error
          # formatting live.
          #
          # Not `! python ...`: negation accepts *any* non-zero status, and a
          # warning promoted to an exception exits non-zero too. A deprecation
          # inside main() would print a traceback and be counted as the refusal
          # working -- which is the whole thing this step exists to notice. So
          # the status, the text, and the absence of a traceback are all checked.
          expect_refusal () {
              phrase=$1; shift
              set +e
              output=$("$@" 2>&1 >/dev/null); status=$?
              set -e
              printf '%s\n' "$output"
              test "$status" -eq 1 || { echo "expected exit 1, got $status" >&2; exit 1; }
              # Before the text check, so a raised exception is reported as one
              # rather than as a missing phrase -- the traceback replaces the
              # refusal on stderr, and the vaguer message would send whoever
              # reads it looking in the wrong place.
              case $output in
                  *Traceback*|*Warning*)
                      echo "raised instead of refusing" >&2; exit 1 ;;
              esac
              case $output in
                  *"$phrase"*) ;;
                  *) echo "refusal did not say: $phrase" >&2; exit 1 ;;
              esac
          }
          expect_refusal "Validation failed" \
              python -W error::DeprecationWarning -W error::SyntaxWarning \
                     "$S/validate.py" does-not-exist.json
          expect_refusal "Refusing to render an invalid artifact" \
              python -W error::DeprecationWarning -W error::SyntaxWarning \
                     "$S/render.py" does-not-exist.json --no-open
          # --repo actually reaching the location check, which the refusals
          # above cannot show: a missing file is refused before validation
          # looks at a single location, so those two would pass unchanged if
          # render.py accepted --repo and then dropped it on the floor.
          #
          # So: an artifact that is valid in every respect except one line
          # range, cited far past the end of a file this repository certainly
          # has. Constructed here rather than committed -- the same reason
          # scope.json and docs.json above are generated, and this file keeps
          # no fixtures. schema_version 1 is deliberate: it is the oldest
          # merged shape and is kept working on purpose, so a later schema
          # cannot quietly turn this check into a refusal about the wrong
          # thing. It goes in its own directory under its exact name, because
          # validation dispatches on the basename and report.html lands beside
          # whatever it is given.
          mkdir -p range-check
          cat > range-check/findings.json <<'ARTIFACT'
          {
            "schema_version": 1,
            "kind": "merged",
            "run": {
              "mode": "sequential",
              "generated_at": "2026-01-01T00:00:00Z",
              "scope": {
                "repo": ".", "mode": "revisions", "base": "HEAD~1",
                "head": "HEAD", "files_changed": 1, "diff_bytes": 1
              }
            },
            "verdict": "clear",
            "passes": [
              {
                "producer": "security",
                "what_holds_up_md": "Nothing to report.",
                "closing_md": "Nothing to report."
              }
            ],
            "findings": [
              {
                "id": "sec-1",
                "producer": "security",
                "disposition": "note",
                "title": "A location past the end of the file",
                "body_md": "Cited beyond README.md's length on purpose.",
                "confidence": "high",
                "locations": [
                  {"path": "README.md", "start_line": 999000, "end_line": 999001}
                ]
              }
            ]
          }
          ARTIFACT
          # The pair is what carries the meaning, and neither half does alone.
          # Without --repo it renders, so the artifact is sound and the range
          # is the only thing wrong with it; with --repo the range is refused
          # by name. Drop the flag from render.py and the first still passes
          # while the second exits 2 from argparse. Accept the flag and ignore
          # it, and the second stops refusing at all.
          python -W error::DeprecationWarning -W error::SyntaxWarning \
                 "$S/render.py" range-check/findings.json --no-open
          expect_refusal "run past the end of 'README.md'" \
              python -W error::DeprecationWarning -W error::SyntaxWarning \
                     "$S/render.py" --repo . range-check/findings.json --no-open

  lint:
    # Style and types are floor checks like the rest: ruff's rule set, the
    # formatter, and mypy --strict, all pinned so a tool release cannot change
    # what passes. What they enforce and why lives in pyproject.toml.
    # .githooks/pre-push mirrors this job locally.
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.12.9 mypy==2.3.1
      - run: ruff check --no-fix
      - run: ruff format --check
      - run: mypy

  constraints:
    name: constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python .github/checks.py

  install:
    name: readme install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: .github/replay-readme-install.sh
